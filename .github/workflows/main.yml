name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. 彻底清理旧残留
    - name: Clean Workspace
      run: |
        rm -rf ./*
        rm -rf ./.gradle

    # 2. 重新生成项目（包含自定义应用图标）
    - name: Generate Clean Android Project
      run: |
        mkdir -p app/src/main/java/com/eink/fanqiereader
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable

        # 补全 AndroidX 开关
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "FanqieEInkReader"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.0' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.eink.fanqiereader'
            compileSdk 34

            defaultConfig {
                applicationId "com.eink.fanqiereader"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 创建自定义的应用图标
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#000000"
                android:pathData="M0,0h108v108h-108z"/>
            <path
                android:fillColor="#FFFFFF"
                android:pathData="M19,3H5c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2V5c0,-1.1 -0.9,-2 -2,-2zM12,17L7,12l1.41,-1.41L12,14.17l5.59,-5.59L19,10l-7,7z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:allowBackup="true"
                android:icon="@drawable/ic_launcher"
                android:label="番茄迷你阅"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:windowNoTitle">true</item>
                <item name="android:windowActionBar">false</item>
                <item name="android:windowFullscreen">true</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#FFFFFF">
            <WebView
                android:id="@+id/webView"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />
        </FrameLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/eink/fanqiereader/MainActivity.java
        package com.eink.fanqiereader;

        import android.annotation.SuppressLint;
        import android.os.Bundle;
        import android.view.View;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;

            @SuppressLint("SetJavaScriptEnabled")
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);

                getWindow().getDecorView().setSystemUiVisibility(
                    View.SYSTEM_UI_FLAG_FULLSCREEN
                    | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                    | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                );

                setContentView(R.layout.activity_main);
                webView = findViewById(R.id.webView);

                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                webView.setWebViewClient(new WebViewClient() {
                    @Override
                    public void onPageFinished(WebView view, String url) {
                        super.onPageFinished(view, url);
                        injectEInkEngine(view);
                    }
                });

                webView.loadUrl("https://fanqienovel.com");
            }

            private void injectEInkEngine(WebView view) {
                String js = "(function() {" +
                    "if (window.einkInjected) return;" +
                    "window.einkInjected = true;" +
                    "var style = document.createElement('style');" +
                    "style.innerHTML = '* { background-color: #ffffff !important; color: #000000 !important; animation: none !important; transition: none !important; box-shadow: none !important; text-shadow: none !important; } .eink-zone-left { position: fixed; top: 0; left: 0; width: 30%; height: 100%; z-index: 9998; } .eink-zone-right { position: fixed; top: 0; right: 0; width: 30%; height: 100%; z-index: 9998; } #eink-btn { position: fixed; bottom: 15px; right: 15px; z-index: 10000; background: #000 !important; color: #fff !important; padding: 8px 14px; font-size: 14px; font-weight: bold; } #eink-panel { display: none; position: fixed; bottom: 60px; right: 15px; z-index: 10000; background: #fff !important; border: 2px solid #000; padding: 14px; width: 230px; font-size: 13px; } #eink-panel label { display: block; margin-top: 8px; font-weight: bold; } #eink-panel input { width: 100%; margin-top: 4px; }';" +
                    "document.head.appendChild(style);" +
                    "var readerStyle = document.createElement('style');" +
                    "document.head.appendChild(readerStyle);" +
                    "function applySettings() {" +
                    "  var fontSize = localStorage.getItem('eink_fs') || '22';" +
                    "  var lineHeight = localStorage.getItem('eink_lh') || '1.6';" +
                    "  var paraSpacing = localStorage.getItem('eink_ps') || '14';" +
                    "  var padding = localStorage.getItem('eink_pd') || '16';" +
                    "  readerStyle.innerHTML = 'article, p, .reader-content, body { font-size: ' + fontSize + 'px !important; line-height: ' + lineHeight + ' !important; padding-left: ' + padding + 'px !important; padding-right: ' + padding + 'px !important; } p { margin-bottom: ' + paraSpacing + 'px !important; }';" +
                    "}" +
                    "applySettings();" +
                    "var fsVal = localStorage.getItem('eink_fs') || 22;" +
                    "var lhVal = localStorage.getItem('eink_lh') || 1.6;" +
                    "var psVal = localStorage.getItem('eink_ps') || 14;" +
                    "var pdVal = localStorage.getItem('eink_pd') || 16;" +
                    "var panel = document.createElement('div');" +
                    "panel.id = 'eink-panel';" +
                    "panel.innerHTML = '<div style=\"font-weight:bold;margin-bottom:8px;border-bottom:1px solid #000;padding-bottom:4px;\">墨案排版设置</div>' +" +
                    "  '<label>字号大小 (px)</label><input type=\"range\" id=\"eink-fs\" min=\"14\" max=\"38\" value=\"' + fsVal + '\">' +" +
                    "  '<label>行间距</label><input type=\"range\" id=\"eink-lh\" min=\"1.0\" max=\"2.5\" step=\"0.1\" value=\"' + lhVal + '\">' +" +
                    "  '<label>段落间距 (px)</label><input type=\"range\" id=\"eink-ps\" min=\"0\" max=\"35\" value=\"' + psVal + '\">' +" +
                    "  '<label>左右边距 (px)</label><input type=\"range\" id=\"eink-pd\" min=\"0\" max=\"40\" value=\"' + pdVal + '\">' +" +
                    "  '<button id=\"eink-close\" style=\"margin-top:12px;width:100%;background:#000!important;color:#fff!important;padding:6px;\">确定并关闭</button>';" +
                    "document.body.appendChild(panel);" +
                    "var btn = document.createElement('button');" +
                    "btn.id = 'eink-btn';" +
                    "btn.innerText = '⚙ 排版';" +
                    "btn.onclick = function() { panel.style.display = panel.style.display === 'block' ? 'none' : 'block'; };" +
                    "document.body.appendChild(btn);" +
                    "document.getElementById('eink-fs').oninput = function(e) { localStorage.setItem('eink_fs', e.target.value); applySettings(); };" +
                    "document.getElementById('eink-lh').oninput = function(e) { localStorage.setItem('eink_lh', e.target.value); applySettings(); };" +
                    "document.getElementById('eink-ps').oninput = function(e) { localStorage.setItem('eink_ps', e.target.value); applySettings(); };" +
                    "document.getElementById('eink-pd').oninput = function(e) { localStorage.setItem('eink_pd', e.target.value); applySettings(); };" +
                    "document.getElementById('eink-close').onclick = function() { panel.style.display = 'none'; };" +
                    "var leftZone = document.createElement('div');" +
                    "leftZone.className = 'eink-zone-left';" +
                    "leftZone.onclick = function(e) { if (panel.style.display === 'block') return; window.scrollBy({ top: -window.innerHeight * 0.88, behavior: 'instant' }); };" +
                    "var rightZone = document.createElement('div');" +
                    "rightZone.className = 'eink-zone-right';" +
                    "rightZone.onclick = function(e) { if (panel.style.display === 'block') return; window.scrollBy({ top: window.innerHeight * 0.88, behavior: 'instant' }); };" +
                    "document.body.appendChild(leftZone);" +
                    "document.body.appendChild(rightZone);" +
                    "})();";

                if (view != null) {
                    view.evaluateJavascript(js, null);
                }
            }

            @Override
            public void onBackPressed() {
                if (webView != null && webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

    # 3. 锁定 Gradle 8.4 环境
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    # 4. 执行编译
    - name: Build APK
      run: gradle assembleDebug

    # 5. 上传产物
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FanqieEInkReader-APK
        path: app/build/outputs/apk/debug/app-debug.apk
